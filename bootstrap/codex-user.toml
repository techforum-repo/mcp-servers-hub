# Codex does not expand ${VAR} inside config values; it reads the token from the
# named environment variable at connection time instead.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_TOKEN"
enabled = true

[mcp_servers.sample-internal-tool]
command = "node"
args = ["__SERVERS_DIR__/sample-internal-tool/dist/index.js"]
enabled = true
